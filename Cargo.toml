[workspace]
resolver = "2"
members = [
    "crates/getter-protocol",
    "crates/getter-core",
    "crates/getter-storage",
    "crates/getter-runtime",
    "crates/getter-coordinator",
    "crates/getter-worker",
    "crates/getter-workload-sdk",
    "crates/getter-cli",
]
exclude = ["examples/sum-squares"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["Getter contributors"]
repository = "https://github.com/benaiah-muga/Getter"
homepage = "https://github.com/benaiah-muga/Getter"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["json", "http1", "http2", "tokio"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
if-addrs = "0.13"
libc = "0.2"
rand = "0.8"
rcgen = { version = "0.13", features = ["pem"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tempfile = "3"
thiserror = "2"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "fs", "io-util"] }
tokio-rustls = "0.26"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
wasmtime = { version = "49.0.4", default-features = false, features = ["cranelift", "runtime", "std"] }
wat = "1"
zeroize = { version = "1.8", features = ["derive"] }

[profile.dev]
debug = 0

[profile.release]
debug = false
lto = "thin"
codegen-units = 16
strip = "symbols"

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
